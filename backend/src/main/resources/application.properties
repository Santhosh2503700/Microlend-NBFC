
spring.application.name=microlend-core
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# KYC uploads reject oversized files server-side.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Web server
server.port=8090
server.error.include-message=always

# --- Security / JWT ---------------------------------------------------------
# Override in prod via env/secret manager. Must be >= 32 bytes for HS256.
microlend.security.jwt.secret=${JWT_SECRET:microlend-dev-secret-key-change-me-in-prod-0123456789}
microlend.security.jwt.full-ttl-minutes=480
microlend.security.jwt.reset-ttl-minutes=15

# --- Storage ----------------------------------------------------------------
microlend.storage.kyc-upload-dir=./uploads/kyc

# --- Delinquency scan ---------------------------------------------
# Default: daily at 01:00 (server timezone).
microlend.delinquency.scan-cron=${DELINQUENCY_SCAN_CRON:0 0 1 * * *}
# PAR aging thresholds
microlend.delinquency.par30-max-dpd=30
microlend.delinquency.par60-max-dpd=60
microlend.delinquency.par90-max-dpd=90

# --- Actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# --- Logging ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.microlend=INFO
